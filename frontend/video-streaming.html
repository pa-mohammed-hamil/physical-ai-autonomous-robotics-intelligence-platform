<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Video Streaming & Tutorials - Physical AI Platform</title>
    <script src="/js/navigation.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            min-height: 100vh;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        .header {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            padding: 20px 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 32px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tabs {
            display: flex;
            gap: 10px;
        }

        .tab {
            padding: 10px 25px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid transparent;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .tab:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .tab.active {
            background: rgba(255, 255, 255, 0.3);
            border-color: #fff;
        }

        /* Tab Content */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Live Streaming Section */
        .stream-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .video-player {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .video-canvas {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 18px;
        }

        .video-controls {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
        }

        .video-info {
            flex: 1;
        }

        .video-title {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .video-meta {
            font-size: 13px;
            opacity: 0.8;
        }

        .control-buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn.secondary {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn.danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        .btn.success {
            background: linear-gradient(135deg, #10b981, #059669);
        }

        /* Tutorial Cards */
        .tutorial-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .tutorial-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s;
            cursor: pointer;
        }

        .tutorial-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .tutorial-thumbnail {
            width: 100%;
            aspect-ratio: 16/9;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            position: relative;
        }

        .tutorial-duration {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
        }

        .tutorial-content {
            padding: 20px;
        }

        .tutorial-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .tutorial-description {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .tutorial-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .tutorial-difficulty {
            padding: 5px 10px;
            border-radius: 5px;
            font-weight: 600;
        }

        .difficulty-beginner {
            background: rgba(16, 185, 129, 0.3);
            color: #10b981;
        }

        .difficulty-intermediate {
            background: rgba(251, 191, 36, 0.3);
            color: #fbbf24;
        }

        .difficulty-advanced {
            background: rgba(239, 68, 68, 0.3);
            color: #ef4444;
        }

        .tutorial-rating {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Guided Operation */
        .guided-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #10b981, #059669);
            transition: width 0.3s;
        }

        .step-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .step-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 20px;
            transition: all 0.3s;
        }

        .step-item.active {
            background: rgba(102, 126, 234, 0.3);
            border: 2px solid #667eea;
        }

        .step-item.completed {
            opacity: 0.6;
        }

        .step-number {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            flex-shrink: 0;
        }

        .step-content {
            flex: 1;
        }

        .step-title {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .step-description {
            font-size: 14px;
            opacity: 0.8;
        }

        /* Recordings */
        .recording-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .recording-item {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .recording-thumbnail {
            width: 150px;
            aspect-ratio: 16/9;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 8px;
            flex-shrink: 0;
        }

        .recording-info {
            flex: 1;
        }

        .recording-title {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .recording-meta {
            font-size: 13px;
            opacity: 0.8;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            padding: 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .modal-body {
            padding: 30px;
        }

        .close-modal {
            float: right;
            font-size: 28px;
            cursor: pointer;
            opacity: 0.7;
        }

        .close-modal:hover {
            opacity: 1;
        }

        /* New Stream Form */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            color: white;
            font-size: 14px;
        }

        .form-group select option {
            background: #667eea;
            color: white;
        }

        /* Toast Notifications */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            border-radius: 10px;
            border-left: 4px solid #10b981;
            min-width: 300px;
            z-index: 2000;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .toast.error {
            border-left-color: #ef4444;
        }

        .toast.warning {
            border-left-color: #fbbf24;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .stream-grid,
            .tutorial-grid {
                grid-template-columns: 1fr;
            }

            .tabs {
                flex-wrap: wrap;
            }

            .recording-item {
                flex-direction: column;
            }

            .recording-thumbnail {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>📹 Robot Video Streaming & Tutorials</h1>
            <div class="tabs">
                <div class="tab active" onclick="switchTab('live')">Live Streams</div>
                <div class="tab" onclick="switchTab('tutorials')">Tutorials</div>
                <div class="tab" onclick="switchTab('guided')">Guided Operations</div>
                <div class="tab" onclick="switchTab('recordings')">Recordings</div>
            </div>
        </div>

        <!-- Live Streaming Tab -->
        <div id="tab-live" class="tab-content active">
            <div style="margin-bottom: 20px;">
                <button class="btn" onclick="showNewStreamModal()">+ New Stream</button>
            </div>

            <div class="stream-grid" id="stream-grid">
                <div class="video-player">
                    <div class="video-canvas">
                        No active streams. Click "New Stream" to start streaming.
                    </div>
                </div>
            </div>
        </div>

        <!-- Tutorials Tab -->
        <div id="tab-tutorials" class="tab-content">
            <div class="tutorial-grid" id="tutorial-grid">
                <!-- Tutorials will be loaded here -->
            </div>
        </div>

        <!-- Guided Operations Tab -->
        <div id="tab-guided" class="tab-content">
            <div style="margin-bottom: 20px;">
                <button class="btn" onclick="showNewGuidedSessionModal()">+ Start Guided Operation</button>
            </div>

            <div id="guided-session-container">
                <div style="text-align: center; padding: 60px; opacity: 0.6;">
                    No active guided session. Click "Start Guided Operation" to begin.
                </div>
            </div>
        </div>

        <!-- Recordings Tab -->
        <div id="tab-recordings" class="tab-content">
            <div class="recording-list" id="recording-list">
                <!-- Recordings will be loaded here -->
            </div>
        </div>
    </div>

    <!-- New Stream Modal -->
    <div id="new-stream-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="close-modal" onclick="closeModal('new-stream-modal')">&times;</span>
                <h2>Create New Video Stream</h2>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Robot ID</label>
                    <input type="text" id="stream-robot-id" placeholder="Enter Robot ID (e.g., ROBOT_001)">
                </div>
                <div class="form-group">
                    <label>Camera Type</label>
                    <select id="stream-camera-type">
                        <option value="front">Front Camera</option>
                        <option value="rear">Rear Camera</option>
                        <option value="left">Left Camera</option>
                        <option value="right">Right Camera</option>
                        <option value="top">Top Camera</option>
                        <option value="gripper">Gripper Camera</option>
                        <option value="depth">Depth Camera</option>
                        <option value="thermal">Thermal Camera</option>
                        <option value="360">360° Panoramic</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Video Quality</label>
                    <select id="stream-quality">
                        <option value="low">Low (480p, 30fps)</option>
                        <option value="medium">Medium (720p, 30fps)</option>
                        <option value="high" selected>High (1080p, 30fps)</option>
                        <option value="ultra">Ultra (4K, 60fps)</option>
                    </select>
                </div>
                <button class="btn" style="width: 100%;" onclick="createStream()">Start Streaming</button>
            </div>
        </div>
    </div>

    <!-- Tutorial Modal -->
    <div id="tutorial-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="close-modal" onclick="closeModal('tutorial-modal')">&times;</span>
                <h2 id="tutorial-modal-title">Tutorial Title</h2>
            </div>
            <div class="modal-body" id="tutorial-modal-body">
                <!-- Tutorial content will be loaded here -->
            </div>
        </div>
    </div>

    <!-- New Guided Session Modal -->
    <div id="new-guided-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="close-modal" onclick="closeModal('new-guided-modal')">&times;</span>
                <h2>Start Guided Operation</h2>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Your User ID</label>
                    <input type="text" id="guided-user-id" placeholder="Enter your User ID">
                </div>
                <div class="form-group">
                    <label>Robot ID</label>
                    <input type="text" id="guided-robot-id" placeholder="Enter Robot ID">
                </div>
                <div class="form-group">
                    <label>Operation Type</label>
                    <select id="guided-operation-type">
                        <option value="first_use">First Time Setup</option>
                        <option value="maintenance">Maintenance Procedure</option>
                        <option value="calibration">Calibration</option>
                    </select>
                </div>
                <button class="btn" style="width: 100%;" onclick="createGuidedSession()">Start Session</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8000/api/v1';
        let currentGuidedSession = null;

        // Tab Switching
        function switchTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });

            // Show selected tab
            document.getElementById(`tab-${tabName}`).classList.add('active');
            event.target.classList.add('active');

            // Load data for tab
            if (tabName === 'tutorials') {
                loadTutorials();
            } else if (tabName === 'recordings') {
                loadRecordings();
            } else if (tabName === 'live') {
                loadStreams();
            }
        }

        // Load Tutorials
        async function loadTutorials() {
            try {
                const response = await fetch(`${API_BASE_URL}/video/tutorials`);
                const data = await response.json();

                const grid = document.getElementById('tutorial-grid');
                grid.innerHTML = '';

                data.tutorials.forEach(tutorial => {
                    const difficultyClass = `difficulty-${tutorial.difficulty}`;
                    const card = document.createElement('div');
                    card.className = 'tutorial-card';
                    card.onclick = () => openTutorial(tutorial.tutorial_id);
                    card.innerHTML = `
                        <div class="tutorial-thumbnail">
                            📚
                            <div class="tutorial-duration">${tutorial.duration_minutes} min</div>
                        </div>
                        <div class="tutorial-content">
                            <div class="tutorial-title">${tutorial.title}</div>
                            <div class="tutorial-description">${tutorial.description}</div>
                            <div class="tutorial-meta">
                                <span class="tutorial-difficulty ${difficultyClass}">${tutorial.difficulty}</span>
                                <span class="tutorial-rating">⭐ ${tutorial.rating} (${tutorial.views} views)</span>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                console.error('Error loading tutorials:', error);
                showToast('Failed to load tutorials', 'error');
            }
        }

        // Open Tutorial
        async function openTutorial(tutorialId) {
            try {
                const response = await fetch(`${API_BASE_URL}/video/tutorials/${tutorialId}`);
                const tutorial = await response.json();

                document.getElementById('tutorial-modal-title').textContent = tutorial.title;
                
                let stepsHTML = '<div class="step-list">';
                tutorial.steps.forEach(step => {
                    stepsHTML += `
                        <div class="step-item">
                            <div class="step-number">${step.step}</div>
                            <div class="step-content">
                                <div class="step-title">${step.title}</div>
                                <div class="step-description">Duration: ${step.duration}</div>
                            </div>
                        </div>
                    `;
                });
                stepsHTML += '</div>';

                document.getElementById('tutorial-modal-body').innerHTML = `
                    <p style="margin-bottom: 20px;">${tutorial.description}</p>
                    <div style="margin-bottom: 20px;">
                        <strong>Category:</strong> ${tutorial.category} | 
                        <strong>Difficulty:</strong> ${tutorial.difficulty} | 
                        <strong>Instructor:</strong> ${tutorial.instructor}
                    </div>
                    <h3 style="margin-bottom: 15px;">Tutorial Steps:</h3>
                    ${stepsHTML}
                    <div style="margin-top: 20px;">
                        <button class="btn" style="width: 100%;">▶ Start Tutorial</button>
                    </div>
                `;

                document.getElementById('tutorial-modal').classList.add('active');
            } catch (error) {
                console.error('Error loading tutorial:', error);
                showToast('Failed to load tutorial details', 'error');
            }
        }

        // Load Streams
        async function loadStreams() {
            try {
                const response = await fetch(`${API_BASE_URL}/video/streams`);
                const data = await response.json();

                const grid = document.getElementById('stream-grid');
                
                if (data.streams.length === 0) {
                    grid.innerHTML = `
                        <div class="video-player">
                            <div class="video-canvas">
                                No active streams. Click "New Stream" to start streaming.
                            </div>
                        </div>
                    `;
                    return;
                }

                grid.innerHTML = '';
                data.streams.forEach(stream => {
                    const player = document.createElement('div');
                    player.className = 'video-player';
                    player.innerHTML = `
                        <div class="video-canvas" id="canvas-${stream.stream_id}">
                            Connecting to stream...
                        </div>
                        <div class="video-controls">
                            <div class="video-info">
                                <div class="video-title">${stream.robot_id} - ${stream.camera_type}</div>
                                <div class="video-meta">
                                    ${stream.quality} | ${stream.viewers} viewers
                                    ${stream.recording ? '🔴 Recording' : ''}
                                </div>
                            </div>
                            <div class="control-buttons">
                                <button class="btn secondary" onclick="toggleRecording('${stream.stream_id}', ${stream.recording})">
                                    ${stream.recording ? '⏹ Stop Recording' : '🔴 Record'}
                                </button>
                                <button class="btn danger" onclick="stopStream('${stream.stream_id}')">
                                    Stop Stream
                                </button>
                            </div>
                        </div>
                    `;
                    grid.appendChild(player);

                    // Connect to WebSocket
                    connectToStream(stream.stream_id);
                });
            } catch (error) {
                console.error('Error loading streams:', error);
            }
        }

        // Connect to Stream WebSocket
        function connectToStream(streamId) {
            const ws = new WebSocket(`ws://localhost:8000/api/v1/video/stream/${streamId}/watch`);
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                if (data.type === 'video_frame') {
                    // Display frame (in production, render to canvas)
                    const canvas = document.getElementById(`canvas-${streamId}`);
                    if (canvas) {
                        canvas.textContent = '📹 Live Stream Active';
                        canvas.style.fontSize = '24px';
                        canvas.style.color = '#10b981';
                    }
                }
            };

            ws.onerror = () => {
                showToast('Stream connection error', 'error');
            };
        }

        // Create Stream
        async function createStream() {
            const robotId = document.getElementById('stream-robot-id').value;
            const cameraType = document.getElementById('stream-camera-type').value;
            const quality = document.getElementById('stream-quality').value;

            if (!robotId) {
                showToast('Please enter a Robot ID', 'warning');
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/video/stream`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        robot_id: robotId,
                        camera_type: cameraType,
                        quality: quality
                    })
                });

                if (!response.ok) throw new Error('Failed to create stream');

                showToast('Stream created successfully!', 'success');
                closeModal('new-stream-modal');
                loadStreams();
            } catch (error) {
                console.error('Error creating stream:', error);
                showToast('Failed to create stream', 'error');
            }
        }

        // Stop Stream
        async function stopStream(streamId) {
            if (!confirm('Are you sure you want to stop this stream?')) return;

            try {
                await fetch(`${API_BASE_URL}/video/stream/${streamId}`, {
                    method: 'DELETE'
                });

                showToast('Stream stopped', 'success');
                loadStreams();
            } catch (error) {
                console.error('Error stopping stream:', error);
                showToast('Failed to stop stream', 'error');
            }
        }

        // Toggle Recording
        async function toggleRecording(streamId, isRecording) {
            const endpoint = isRecording ? 'stop' : 'start';
            
            try {
                await fetch(`${API_BASE_URL}/video/stream/${streamId}/recording/${endpoint}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({description: 'Robot operation'})
                });

                showToast(`Recording ${isRecording ? 'stopped' : 'started'}`, 'success');
                loadStreams();
            } catch (error) {
                console.error('Error toggling recording:', error);
                showToast('Failed to toggle recording', 'error');
            }
        }

        // Load Recordings
        async function loadRecordings() {
            try {
                const response = await fetch(`${API_BASE_URL}/video/recordings`);
                const data = await response.json();

                const list = document.getElementById('recording-list');
                
                if (data.recordings.length === 0) {
                    list.innerHTML = '<div style="text-align: center; padding: 60px; opacity: 0.6;">No recordings available</div>';
                    return;
                }

                list.innerHTML = '';
                data.recordings.forEach(recording => {
                    const item = document.createElement('div');
                    item.className = 'recording-item';
                    item.innerHTML = `
                        <div class="recording-thumbnail"></div>
                        <div class="recording-info">
                            <div class="recording-title">${recording.robot_id} - ${recording.camera_type}</div>
                            <div class="recording-meta">
                                Duration: ${Math.floor(recording.duration_seconds / 60)}:${(recording.duration_seconds % 60).toFixed(0).padStart(2, '0')} | 
                                Size: ${recording.file_size_mb.toFixed(2)} MB | 
                                Date: ${new Date(recording.start_time).toLocaleString()}
                            </div>
                        </div>
                        <button class="btn">▶ Play</button>
                    `;
                    list.appendChild(item);
                });
            } catch (error) {
                console.error('Error loading recordings:', error);
            }
        }

        // Create Guided Session
        async function createGuidedSession() {
            const userId = document.getElementById('guided-user-id').value;
            const robotId = document.getElementById('guided-robot-id').value;
            const operationType = document.getElementById('guided-operation-type').value;

            if (!userId || !robotId) {
                showToast('Please fill in all fields', 'warning');
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/video/guided-session`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        user_id: userId,
                        robot_id: robotId,
                        operation_type: operationType
                    })
                });

                const session = await response.json();
                currentGuidedSession = session;

                showToast('Guided session started!', 'success');
                closeModal('new-guided-modal');
                displayGuidedSession(session);
            } catch (error) {
                console.error('Error creating guided session:', error);
                showToast('Failed to create guided session', 'error');
            }
        }

        // Display Guided Session
        function displayGuidedSession(session) {
            const container = document.getElementById('guided-session-container');
            const progress = (session.current_step / session.total_steps) * 100;

            let stepsHTML = '';
            session.steps.forEach((step, index) => {
                const isActive = index === session.current_step;
                const isCompleted = index < session.current_step;
                const classes = `step-item ${isActive ? 'active' : ''} ${isCompleted ? 'completed' : ''}`;
                
                stepsHTML += `
                    <div class="${classes}">
                        <div class="step-number">${step.step}</div>
                        <div class="step-content">
                            <div class="step-title">${step.title}</div>
                            <div class="step-description">${step.description}</div>
                            <div class="step-description">⏱ ${step.duration_estimate}</div>
                        </div>
                        ${isActive ? '<button class="btn" onclick="nextGuidedStep()">Next Step →</button>' : ''}
                    </div>
                `;
            });

            container.innerHTML = `
                <div class="guided-section">
                    <h2 style="margin-bottom: 20px;">${session.operation_type.replace('_', ' ').toUpperCase()}</h2>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${progress}%"></div>
                    </div>
                    <div style="margin-bottom: 20px; text-align: center;">
                        Step ${session.current_step + 1} of ${session.total_steps}
                    </div>
                    <div class="step-list">
                        ${stepsHTML}
                    </div>
                </div>
            `;
        }

        // Next Guided Step
        async function nextGuidedStep() {
            if (!currentGuidedSession) return;

            try {
                const response = await fetch(`${API_BASE_URL}/video/guided-session/${currentGuidedSession.session_id}/next-step`, {
                    method: 'POST'
                });

                const result = await response.json();
                
                if (result.completed) {
                    showToast('Guided operation completed! 🎉', 'success');
                    currentGuidedSession = null;
                    document.getElementById('guided-session-container').innerHTML = `
                        <div style="text-align: center; padding: 60px;">
                            <h2 style="margin-bottom: 20px;">✅ Operation Completed!</h2>
                            <p style="margin-bottom: 30px;">Great job! You've successfully completed the guided operation.</p>
                            <button class="btn" onclick="showNewGuidedSessionModal()">Start Another Session</button>
                        </div>
                    `;
                } else {
                    currentGuidedSession.current_step = result.current_step;
                    displayGuidedSession(currentGuidedSession);
                }
            } catch (error) {
                console.error('Error advancing step:', error);
                showToast('Failed to advance step', 'error');
            }
        }

        // Modal Functions
        function showNewStreamModal() {
            document.getElementById('new-stream-modal').classList.add('active');
        }

        function showNewGuidedSessionModal() {
            document.getElementById('new-guided-modal').classList.add('active');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        // Toast Notification
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadStreams();
        });
    </script>
</body>
</html>
