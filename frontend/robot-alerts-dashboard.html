<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Alerts Dashboard | Real-Time Monitoring</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --critical: #dc2626;
            --emergency: #991b1b;
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --border: #334155;
            --shadow: rgba(0, 0, 0, 0.3);
            --gradient-1: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-2: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --gradient-3: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --glassmorphism: rgba(255, 255, 255, 0.05);
            --backdrop-blur: blur(20px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(139, 92, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(147, 51, 234, 0.15) 0px, transparent 50%);
            min-height: 100vh;
            padding: 0;
            color: var(--text-primary);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .dashboard {
            max-width: 1600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .status-bar {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .status-item {
            text-align: center;
        }

        .status-item .label {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .status-item .value {
            font-size: 2em;
            font-weight: bold;
        }

        .status-item.healthy .value {
            color: #28a745;
        }

        .status-item.warning .value {
            color: #ffc107;
        }

        .status-item.critical .value {
            color: #dc3545;
        }

        .alerts-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .alert-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            border-left: 6px solid #666;
            animation: slideIn 0.3s ease-out;
            position: relative;
            overflow: hidden;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            border-radius: 50%;
            transform: translate(30%, -30%);
        }

        .alert-card.info {
            border-left-color: #17a2b8;
        }

        .alert-card.warning {
            border-left-color: #ffc107;
        }

        .alert-card.error {
            border-left-color: #fd7e14;
        }

        .alert-card.critical {
            border-left-color: #dc3545;
            animation: pulse 2s ease-in-out infinite;
        }

        .alert-card.emergency {
            border-left-color: #721c24;
            background: linear-gradient(135deg, #fff 0%, #ffe5e8 100%);
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 5px 20px rgba(220,53,69,0.2);
            }
            50% {
                box-shadow: 0 5px 30px rgba(220,53,69,0.5);
            }
        }

        .alert-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            gap: 15px;
        }

        .alert-icon {
            font-size: 2.5em;
            line-height: 1;
        }

        .alert-title {
            flex: 1;
        }

        .alert-title h3 {
            font-size: 1.3em;
            margin-bottom: 5px;
            color: #333;
        }

        .alert-title .robot-id {
            color: #666;
            font-size: 0.9em;
        }

        .severity-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
            text-transform: uppercase;
        }

        .severity-badge.info {
            background: #d1ecf1;
            color: #0c5460;
        }

        .severity-badge.warning {
            background: #fff3cd;
            color: #856404;
        }

        .severity-badge.error {
            background: #ffeaa7;
            color: #856404;
        }

        .severity-badge.critical {
            background: #f8d7da;
            color: #721c24;
        }

        .severity-badge.emergency {
            background: #721c24;
            color: white;
        }

        .alert-message {
            color: #555;
            line-height: 1.6;
            margin-bottom: 15px;
            font-size: 1.05em;
        }

        .alert-action {
            background: #f8f9fa;
            border-left: 3px solid #007bff;
            padding: 12px;
            margin: 15px 0;
            border-radius: 5px;
        }

        .alert-action strong {
            color: #007bff;
        }

        .resolution-steps {
            margin-top: 15px;
        }

        .resolution-steps h4 {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .resolution-steps ol {
            margin-left: 20px;
            color: #555;
            line-height: 1.8;
        }

        .alert-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            font-size: 0.85em;
            color: #999;
        }

        .alert-time {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .dismiss-btn {
            background: #6c757d;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            transition: background 0.3s;
        }

        .dismiss-btn:hover {
            background: #5a6268;
        }

        .action-btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            margin-top: 10px;
            width: 100%;
            transition: background 0.3s;
        }

        .action-btn:hover {
            background: #0056b3;
        }

        .action-btn.emergency {
            background: #dc3545;
        }

        .action-btn.emergency:hover {
            background: #c82333;
        }

        .no-alerts {
            text-align: center;
            padding: 60px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        .no-alerts .icon {
            font-size: 4em;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .no-alerts h3 {
            color: #666;
            margin-bottom: 10px;
        }

        .no-alerts p {
            color: #999;
        }

        .filter-bar {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .filter-bar select,
        .filter-bar input {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            flex: 1;
            min-width: 200px;
        }

        .filter-bar select:focus,
        .filter-bar input:focus {
            outline: none;
            border-color: #007bff;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            text-align: center;
        }

        .stat-card .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            margin: 10px 0;
        }

        .stat-card .stat-label {
            color: #666;
            font-size: 0.9em;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
        }

        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .alerts-container {
                grid-template-columns: 1fr;
            }

            .status-bar {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <header>
            <h1>🤖 Robot Alerts Dashboard</h1>
            <p>Real-Time Monitoring & Alert Management</p>
        </header>

        <!-- Status Bar -->
        <div class="status-bar">
            <div class="status-item healthy">
                <div class="label">Active Robots</div>
                <div class="value" id="activeRobots">3</div>
            </div>
            <div class="status-item warning">
                <div class="label">Active Alerts</div>
                <div class="value" id="activeAlerts">4</div>
            </div>
            <div class="status-item critical">
                <div class="label">Critical Issues</div>
                <div class="value" id="criticalIssues">1</div>
            </div>
            <div class="status-item healthy">
                <div class="label">System Status</div>
                <div class="value" id="systemStatus">⚠️</div>
            </div>
        </div>

        <!-- Filter Bar -->
        <div class="filter-bar">
            <select id="severityFilter">
                <option value="">All Severities</option>
                <option value="emergency">Emergency</option>
                <option value="critical">Critical</option>
                <option value="error">Error</option>
                <option value="warning">Warning</option>
                <option value="info">Info</option>
            </select>

            <select id="robotFilter">
                <option value="">All Robots</option>
                <option value="ROBOT-001">ROBOT-001</option>
                <option value="ROBOT-002">ROBOT-002</option>
                <option value="ROBOT-003">ROBOT-003</option>
            </select>

            <select id="typeFilter">
                <option value="">All Types</option>
                <option value="battery">Battery</option>
                <option value="component">Component Health</option>
                <option value="network">Network</option>
                <option value="security">Security</option>
                <option value="system">System</option>
            </select>

            <button class="action-btn" onclick="refreshAlerts()">🔄 Refresh</button>
        </div>

        <!-- Alerts Container -->
        <div id="alertsContainer" class="alerts-container">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading alerts...</p>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000/api/v1/alerts';

        // Sample alerts data (in production, fetch from API)
        const sampleAlerts = [
            {
                alert_id: 'ALERT-20261016123456-1234',
                alert_type: 'unauthorized_access',
                severity: 'emergency',
                title: '🚨 SECURITY ALERT: Unauthorized Access Attempt',
                message: '⚠️ WARNING! An unauthorized person may be attempting to control your robot. Remote control has been disabled, and the robot has entered a safe state. Owner verification is required before control can resume.',
                robot_id: 'ROBOT-001',
                timestamp: new Date().toISOString(),
                action_required: 'IMMEDIATE: Verify robot ownership and reset credentials',
                resolution_steps: [
                    'Robot is now in lockdown mode',
                    'Review access logs immediately',
                    'Verify your identity through admin portal',
                    'Change all passwords and API keys',
                    'Enable two-factor authentication',
                    'Contact security team immediately'
                ]
            },
            {
                alert_id: 'ALERT-20261016120000-2345',
                alert_type: 'health_critical',
                severity: 'critical',
                title: '🏥 CRITICAL: Component Health 0%',
                message: 'Motor servo health has reached 0%. Immediate replacement required to prevent total failure.',
                robot_id: 'ROBOT-002',
                timestamp: new Date(Date.now() - 30*60000).toISOString(),
                action_required: 'URGENT: Replace component immediately',
                resolution_steps: [
                    'Disable affected subsystem',
                    'Order replacement component (expedited shipping)',
                    'Schedule emergency maintenance',
                    'Do not operate robot until repaired'
                ]
            },
            {
                alert_id: 'ALERT-20261016110000-3456',
                alert_type: 'vpn_failure',
                severity: 'error',
                title: '🔒 VPN Connection Failed',
                message: 'VPN connection has failed. Remote access is not available. Enterprise network access disabled.',
                robot_id: 'ROBOT-003',
                timestamp: new Date(Date.now() - 60*60000).toISOString(),
                action_required: 'Remove VPN service or restore connection',
                resolution_steps: [
                    'Check VPN configuration',
                    'Verify VPN credentials',
                    'Test internet connectivity',
                    'Consider disabling VPN if not required',
                    'Contact network administrator'
                ]
            },
            {
                alert_id: 'ALERT-20261016100000-4567',
                alert_type: 'battery_low',
                severity: 'warning',
                title: '🔋 Low Battery Warning',
                message: 'Battery level is low (18%). Please charge the robot soon to avoid operational interruption.',
                robot_id: 'ROBOT-001',
                timestamp: new Date(Date.now() - 90*60000).toISOString(),
                action_required: 'Charge robot battery within the next hour',
                resolution_steps: [
                    'Navigate robot to charging station',
                    'Connect charging cable',
                    'Monitor charging progress'
                ]
            }
        ];

        function getAlertIcon(alertType) {
            const icons = {
                'unauthorized_access': '🚨',
                'security_breach': '🚨',
                'battery_low': '🔋',
                'battery_critical': '🔋',
                'health_critical': '⚙️',
                'component_failure': '⚠️',
                'vpn_failure': '🔒',
                'network_issue': '📡',
                'internet_down': '🌐',
                'memory_warning': '💾',
                'memory_critical': '💾',
                'emergency_stop': '🛑',
                'collision_detected': '💥'
            };
            return icons[alertType] || '⚠️';
        }

        function formatTimestamp(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            const diff = now - date;
            
            if (diff < 60000) return 'Just now';
            if (diff < 3600000) return `${Math.floor(diff/60000)} minutes ago`;
            if (diff < 86400000) return `${Math.floor(diff/3600000)} hours ago`;
            
            return date.toLocaleString();
        }

        function createAlertCard(alert) {
            return `
                <div class="alert-card ${alert.severity}" data-alert-id="${alert.alert_id}">
                    <div class="alert-header">
                        <div class="alert-icon">${getAlertIcon(alert.alert_type)}</div>
                        <div class="alert-title">
                            <h3>${alert.title}</h3>
                            <div class="robot-id">Robot ID: ${alert.robot_id}</div>
                        </div>
                        <span class="severity-badge ${alert.severity}">${alert.severity}</span>
                    </div>

                    <div class="alert-message">
                        ${alert.message}
                    </div>

                    ${alert.action_required ? `
                        <div class="alert-action">
                            <strong>Action Required:</strong> ${alert.action_required}
                        </div>
                    ` : ''}

                    ${alert.resolution_steps && alert.resolution_steps.length > 0 ? `
                        <div class="resolution-steps">
                            <h4>📋 Resolution Steps:</h4>
                            <ol>
                                ${alert.resolution_steps.map(step => `<li>${step}</li>`).join('')}
                            </ol>
                        </div>
                    ` : ''}

                    ${alert.severity === 'emergency' || alert.severity === 'critical' ? `
                        <button class="action-btn ${alert.severity}" onclick="handleEmergency('${alert.alert_id}')">
                            🚨 Acknowledge & Take Action
                        </button>
                    ` : ''}

                    <div class="alert-meta">
                        <div class="alert-time">
                            <span>🕐</span>
                            <span>${formatTimestamp(alert.timestamp)}</span>
                        </div>
                        <button class="dismiss-btn" onclick="dismissAlert('${alert.alert_id}')">
                            Dismiss
                        </button>
                    </div>
                </div>
            `;
        }

        function displayAlerts(alerts) {
            const container = document.getElementById('alertsContainer');
            
            if (alerts.length === 0) {
                container.innerHTML = `
                    <div class="no-alerts" style="grid-column: 1 / -1;">
                        <div class="icon">✅</div>
                        <h3>No Active Alerts</h3>
                        <p>All systems operational. Your robots are running smoothly!</p>
                    </div>
                `;
                return;
            }

            // Sort by severity (emergency first)
            const severityOrder = { 'emergency': 0, 'critical': 1, 'error': 2, 'warning': 3, 'info': 4 };
            alerts.sort((a, b) => severityOrder[a.severity] - severityOrder[b.severity]);

            container.innerHTML = alerts.map(alert => createAlertCard(alert)).join('');
            
            // Update status bar
            updateStatusBar(alerts);
        }

        function updateStatusBar(alerts) {
            const critical = alerts.filter(a => a.severity === 'critical' || a.severity === 'emergency').length;
            
            document.getElementById('activeAlerts').textContent = alerts.length;
            document.getElementById('criticalIssues').textContent = critical;
            
            const statusItem = document.getElementById('criticalIssues').parentElement;
            statusItem.className = 'status-item';
            if (critical > 0) {
                statusItem.classList.add('critical');
            } else if (alerts.length > 0) {
                statusItem.classList.add('warning');
            } else {
                statusItem.classList.add('healthy');
            }

            const systemStatus = document.getElementById('systemStatus');
            if (critical > 0) {
                systemStatus.textContent = '🔴';
            } else if (alerts.length > 0) {
                systemStatus.textContent = '🟡';
            } else {
                systemStatus.textContent = '🟢';
            }
        }

        function applyFilters() {
            const severityFilter = document.getElementById('severityFilter').value;
            const robotFilter = document.getElementById('robotFilter').value;
            const typeFilter = document.getElementById('typeFilter').value;

            let filtered = sampleAlerts;

            if (severityFilter) {
                filtered = filtered.filter(a => a.severity === severityFilter);
            }

            if (robotFilter) {
                filtered = filtered.filter(a => a.robot_id === robotFilter);
            }

            if (typeFilter) {
                filtered = filtered.filter(a => a.alert_type.includes(typeFilter));
            }

            displayAlerts(filtered);
        }

        function handleEmergency(alertId) {
            const alert = sampleAlerts.find(a => a.alert_id === alertId);
            if (alert) {
                if (confirm(`Acknowledge emergency alert for ${alert.robot_id}?\n\nThis will log your acknowledgment and open the resolution workflow.`)) {
                    console.log(`Emergency acknowledged: ${alertId}`);
                    // In production: call API to acknowledge
                    alert('Emergency acknowledged. Resolution workflow initiated.');
                }
            }
        }

        function dismissAlert(alertId) {
            if (confirm('Dismiss this alert?')) {
                const card = document.querySelector(`[data-alert-id="${alertId}"]`);
                if (card) {
                    card.style.animation = 'slideOut 0.3s ease-out';
                    setTimeout(() => {
                        card.remove();
                        // In production: call API to dismiss
                        const index = sampleAlerts.findIndex(a => a.alert_id === alertId);
                        if (index > -1) {
                            sampleAlerts.splice(index, 1);
                        }
                        applyFilters();
                    }, 300);
                }
            }
        }

        function refreshAlerts() {
            document.getElementById('alertsContainer').innerHTML = `
                <div class="loading" style="grid-column: 1 / -1;">
                    <div class="spinner"></div>
                    <p>Refreshing alerts...</p>
                </div>
            `;
            
            // Simulate API call
            setTimeout(() => {
                applyFilters();
            }, 500);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            displayAlerts(sampleAlerts);
            
            // Set up filter listeners
            document.getElementById('severityFilter').addEventListener('change', applyFilters);
            document.getElementById('robotFilter').addEventListener('change', applyFilters);
            document.getElementById('typeFilter').addEventListener('change', applyFilters);

            // Auto-refresh every 30 seconds
            setInterval(refreshAlerts, 30000);
        });

        // Add slideOut animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideOut {
                from {
                    opacity: 1;
                    transform: translateX(0);
                }
                to {
                    opacity: 0;
                    transform: translateX(100px);
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
