# backend: deployment template intentionally disabled.
# Configure image, storage, RBAC, credentials, resource limits, and security before applying.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: physical-ai-backend
  namespace: physical-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: physical-ai-backend
  template:
    metadata:
      labels:
        app: physical-ai-backend
    spec:
      containers:
        - name: backend
          image: physical-ai-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: APP_ENV
              value: "production"
            - name: ROBOT_MODE
              value: "simulation"
            - name: SIMULATION_ONLY
              value: "true"
            - name: HARDWARE_ACTUATION_ENABLED
              value: "false"
            - name: PHYSICAL_ROBOT_CONTROL_ENABLED
              value: "false"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: physical-ai-secrets
                  key: database-url
            - name: REDIS_URL
              value: "redis://redis:6379/0"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: physical-ai-backend
  namespace: physical-ai
spec:
  type: ClusterIP
  selector:
    app: physical-ai-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
