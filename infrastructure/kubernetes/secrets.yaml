# secrets: deployment template intentionally disabled.
# Configure image, storage, RBAC, credentials, resource limits, and security before applying.

apiVersion: v1
kind: Secret
metadata:
  name: physical-ai-secrets
  namespace: physical-ai
type: Opaque
stringData:
  # Database
  database-url: "postgresql+psycopg://robotics:REPLACE_PASSWORD@postgres:5432/physical_ai"

  # Authentication
  SECRET_KEY: "REPLACE_WITH_RANDOM_SECRET"
  JWT_SECRET_KEY: "REPLACE_WITH_RANDOM_JWT_SECRET"

  # AI Providers
  OPENAI_API_KEY: ""
  GEMINI_API_KEY: ""

  # Redis (development instance without authentication)
  REDIS_URL: "redis://redis:6379/0"

  # Qdrant (development instance without authentication)
  QDRANT_URL: "http://qdrant:6333"

  # Grafana
  GRAFANA_ADMIN_USER: "admin"
  GRAFANA_ADMIN_PASSWORD: "REPLACE_WITH_STRONG_PASSWORD"
