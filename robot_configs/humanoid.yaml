
version: "1.0.0"

robot:
  id: "HUMANOID_001"
  name: "Physical AI Humanoid Robot"
  type: humanoid
  enabled: true
  mode: simulation

  physical_properties:
    height_m: 1.7
    mass_kg: 65.0
    degrees_of_freedom: 28

  initial_pose:
    x: 0.0
    y: 0.0
    z: 0.9
    roll: 0.0
    pitch: 0.0
    yaw: 0.0

joints:
  enabled: true
  control_mode: position

  groups:
    head:
      - neck_yaw
      - neck_pitch

    left_arm:
      - left_shoulder_pitch
      - left_shoulder_roll
      - left_shoulder_yaw
      - left_elbow
      - left_wrist_pitch
      - left_wrist_yaw

    right_arm:
      - right_shoulder_pitch
      - right_shoulder_roll
      - right_shoulder_yaw
      - right_elbow
      - right_wrist_pitch
      - right_wrist_yaw

    left_leg:
      - left_hip_yaw
      - left_hip_roll
      - left_hip_pitch
      - left_knee
      - left_ankle_pitch
      - left_ankle_roll

    right_leg:
      - right_hip_yaw
      - right_hip_roll
      - right_hip_pitch
      - right_knee
      - right_ankle_pitch
      - right_ankle_roll

  limits:
    max_velocity_rad_s: 1.5
    max_acceleration_rad_s2: 3.0
    max_torque_nm: 100

controllers:
  enabled: true
  main_controller: humanoid_controller

  joint_controller:
    enabled: true
    type: joint_trajectory

  balance_controller:
    enabled: true
    type: whole_body_balance
    center_of_mass_control: true
    zero_moment_point_control: true
    fall_detection: true

  locomotion_controller:
    enabled: true
    type: bipedal_locomotion
    gait: walking
    max_walking_speed_mps: 0.8

  manipulation_controller:
    enabled: true
    inverse_kinematics: true
    grasp_planning: true
    pick_and_place: true

locomotion:
  enabled: true

  supported_modes:
    - standing
    - walking
    - turning
    - crouching

  parameters:
    step_length_m: 0.3
    step_height_m: 0.08
    step_frequency_hz: 1.5
    maximum_slope_deg: 10

  features:
    dynamic_balance: true
    terrain_adaptation: true
    obstacle_avoidance: true
    fall_risk_prediction: true

sensors:
  enabled: true

  rgb_camera:
    enabled: true
    resolution: [1280, 720]
    fps: 30

  depth_camera:
    enabled: true
    range_m: 10.0

  lidar:
    enabled: true
    range_m: 20.0

  imu:
    enabled: true
    update_rate_hz: 100

  force_torque:
    enabled: true
    update_rate_hz: 100

  joint_encoders:
    enabled: true
    update_rate_hz: 100

  foot_pressure:
    enabled: true
    update_rate_hz: 100

perception:
  enabled: true
  object_detection: true
  object_tracking: true
  human_detection: true
  pose_estimation: true
  depth_estimation: true
  scene_understanding: true
  sensor_fusion: true

navigation:
  enabled: true
  localization: true
  mapping: true
  slam: true
  global_path_planning: true
  local_path_planning: true
  obstacle_avoidance: true
  collision_checking: true

manipulation:
  enabled: true
  grasp_detection: true
  grasp_planning: true
  motion_planning: true
  inverse_kinematics: true
  pick_and_place: true
  force_feedback: true

  limits:
    max_payload_kg: 3.0
    max_gripper_force_n: 30

battery:
  enabled: true
  nominal_voltage_v: 48
  capacity_ah: 30
  initial_soc_percent: 100

  monitoring:
    voltage: true
    current: true
    temperature: true
    state_of_health: true
    charge_cycles: true

  thresholds:
    soc_warning_percent: 15
    soc_critical_percent: 5
    temperature_warning_c: 48
    temperature_critical_c: 65

ai:
  enabled: true

  models:
    vision_language_model: true
    vision_language_action: true
    world_model: true
    reinforcement_learning: true
    anomaly_detection: true
    failure_prediction: true
    rul_prediction: true

  agents:
    task_planning: true
    navigation: true
    manipulation: true
    perception: true
    maintenance: true
    safety: true

  rag:
    enabled: true
    robot_manual_retrieval: true
    maintenance_knowledge: true
    troubleshooting: true

predictive_maintenance:
  enabled: true
  motor_health: true
  joint_health: true
  actuator_health: true
  battery_health: true
  sensor_health: true
  failure_prediction: true
  remaining_useful_life_prediction: true

health_monitoring:
  enabled: true
  interval_seconds: 5

  metrics:
    - robot_health_score
    - motor_temperature
    - joint_temperature
    - joint_position_error
    - actuator_health
    - battery_soc
    - sensor_health
    - fall_risk_score
    - failure_probability
    - rul_hours

safety:
  enabled: true
  simulation_only: true

  collision_detection: true
  human_proximity_detection: true
  fall_detection: true
  joint_limit_validation: true
  trajectory_validation: true
  simulated_emergency_stop: true
  simulated_motion_inhibition: true
  human_review_required: true

  physical_robot_control_enabled: false
  hardware_actuation_enabled: false
  remote_motion_commands_enabled: false
  autonomous_physical_execution_enabled: false
  automatic_emergency_stop_reset_enabled: false

telemetry:
  enabled: true
  collection_interval_ms: 1000
  websocket_endpoint: "/ws/telemetry"
  save_to_database: true
  save_to_csv: true
  save_to_json: true

simulation:
  enabled: true
  engine: mujoco
  time_step_seconds: 0.002
  duration_seconds: 300
  random_seed: 42

  scenarios:
    - standing
    - walking
    - navigation
    - manipulation
    - obstacle_avoidance
    - joint_failure
    - motor_failure
    - sensor_failure
    - overheating
    - emergency

logging:
  enabled: true
  level: INFO
  output: "reports/humanoid_robot.json"
